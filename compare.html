<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compara productos de ciberseguridad lado a lado">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#07111f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CyberMatrix">
  <meta property="og:url" content="https://pedri77.github.io/cybersecurity-master-matrix/compare.html">
  <meta property="og:title" content="Comparador — CyberMatrix">
  <meta property="og:description" content="Compara productos de ciberseguridad lado a lado">
  <link rel="canonical" href="https://pedri77.github.io/cybersecurity-master-matrix/compare.html">
  <title>Comparador — CyberMatrix</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="nav-slot"></div>

  <main class="page-content" id="main-content">
    <div class="container">

      <section class="hero">
        <div class="eyebrow">Comparador</div>
        <h1>Comparar productos</h1>
        <p>Selecciona hasta 4 productos para compararlos lado a lado.</p>
      </section>

      <div class="search-wrapper" id="search-wrapper">
        <div class="compare-selector">
          <input id="search" type="search" placeholder="Buscar producto para anadir..." autocomplete="off">
          <button class="btn" onclick="exportComparison()" id="btn-export" style="display:none">Exportar CSV</button>
          <button class="btn btn-danger" id="btn-clear" style="display:none">Limpiar</button>
          <button class="btn" id="btn-copy" style="display:none" onclick="copyToClipboard(location.href, this)">Copiar enlace</button>
        </div>
        <div id="search-results" class="compare-search-results" style="display:none"></div>
      </div>

      <div id="selected" class="compare-selected"></div>

      <div id="comparison"></div>

    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/data.js"></script>
  <script src="assets/compare.js"></script>
</body>
</html>
