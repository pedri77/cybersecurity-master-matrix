<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ranking contextual de productos de ciberseguridad con filtros y pesos ajustables">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#003049">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CyberMatrix">
  <meta property="og:url" content="https://pedri77.github.io/cybersecurity-master-matrix/ranking.html">
  <meta property="og:title" content="Ranking — CyberMatrix">
  <meta property="og:description" content="Ranking contextual de productos de ciberseguridad con filtros y pesos ajustables">
  <link rel="canonical" href="https://pedri77.github.io/cybersecurity-master-matrix/ranking.html">
  <title>Ranking — CyberMatrix</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="nav-slot"></div>

  <main class="page-content" id="main-content">
    <div class="container">

      <section class="hero">
        <div class="eyebrow">Ranking</div>
        <h1>Ranking contextual</h1>
        <p>Filtra por requisitos obligatorios y ajusta los pesos para obtener un ranking personalizado.</p>
      </section>

      <div class="ranking-controls">
        <!-- Filters -->
        <div class="ranking-filters">
          <h3>Filtros eliminatorios</h3>

          <div class="filter-group">
            <label>Categoria</label>
            <select id="f-category">
              <option value="">Todas las categorias</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Dominio</label>
            <select id="f-domain"></select>
          </div>

          <div class="filter-group">
            <label>Despliegue obligatorio</label>
            <select id="f-deploy">
              <option value="">Cualquiera</option>
              <option value="SaaS">SaaS</option>
              <option value="On-prem">On-prem</option>
              <option value="Híbrido">Hibrido</option>
              <option value="Cloud">Cloud</option>
              <option value="Appliance">Appliance</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Cobertura minima (categorias)</label>
            <select id="f-min-cats">
              <option value="0">Sin minimo</option>
              <option value="2">2+</option>
              <option value="3">3+</option>
              <option value="5">5+</option>
              <option value="8">8+</option>
            </select>
          </div>
        </div>

        <!-- Weights -->
        <div class="ranking-weights">
          <h3>Pesos de evaluacion</h3>

          <div style="margin-bottom:14px;">
            <label style="font-size:0.82rem;color:var(--text-secondary);display:block;margin-bottom:8px;">Presets</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn" style="font-size:0.78rem;padding:4px 12px;" onclick="applyPreset('ciso-siem')">CISO: SIEM/SOC</button>
              <button class="btn" style="font-size:0.78rem;padding:4px 12px;" onclick="applyPreset('startup-iam')">Startup: IAM</button>
              <button class="btn" style="font-size:0.78rem;padding:4px 12px;" onclick="applyPreset('ot-industrial')">OT/Industrial</button>
            </div>
          </div>

          <div class="weight-row">
            <label title="Cuantas categorias tecnologicas cubre el producto. Mas categorias = solucion mas completa.">Cobertura de categorias</label>
            <input type="range" id="w-cats" min="0" max="10" value="5">
            <span class="weight-val" id="wv-cats">5</span>
          </div>

          <div class="weight-row">
            <label title="En cuantos dominios de seguridad opera el proveedor (red, identidad, cloud, etc.).">Cobertura de dominios</label>
            <input type="range" id="w-doms" min="0" max="10" value="3">
            <span class="weight-val" id="wv-doms">3</span>
          </div>

          <div class="weight-row">
            <label title="Cuantas categorias de prioridad Alta cubre. Alta = evaluadas por Gartner MQ o Market Guide.">Prioridad alta (categorias)</label>
            <input type="range" id="w-priority" min="0" max="10" value="5">
            <span class="weight-val" id="wv-priority">5</span>
          </div>

          <div class="weight-row">
            <label title="Menos competidores directos = producto mas especializado/nicho. Invertido: menor competencia = mayor score.">Competidores (menos = mas nicho)</label>
            <input type="range" id="w-niche" min="0" max="10" value="2">
            <span class="weight-val" id="wv-niche">2</span>
          </div>

          <div class="weight-row">
            <label title="Total de categorias del proveedor (no solo este producto). Mide la amplitud del ecosistema del fabricante.">Amplitud del proveedor</label>
            <input type="range" id="w-provider" min="0" max="10" value="3">
            <span class="weight-val" id="wv-provider">3</span>
          </div>

          <div class="weight-row">
            <label title="Cuantas de las 20 capacidades de evaluacion tienen datos verificados. Mas datos = mayor confianza en la evaluacion.">Confianza (datos evaluados)</label>
            <input type="range" id="w-confidence" min="0" max="10" value="4">
            <span class="weight-val" id="wv-confidence">4</span>
          </div>

          <div style="margin-top:12px">
            <button class="btn" id="btn-reset-weights" style="font-size:0.82rem;padding:6px 14px;">Resetear pesos</button>
          </div>
        </div>
      </div>

      <div class="section-header">
        <h2>Resultados</h2>
        <span id="resultCount" class="result-count"></span>
      </div>

      <div id="ranking"></div>

    </div>
  </main>

  <div id="footer-slot"></div>

  <script src="assets/data.js"></script>
  <script src="assets/ranking.js"></script>
</body>
</html>
